id: refund.happy
version: 5
risk_tier: normal
slices: [refund]
environment: refund@2
seed:
  customers: [{id: C-2, name: Grace Hopper}]
  orders: [{id: ORD-021, customer_id: C-2, amount_cents: 1250}]
  settings: [{key: approval_limit_cents, value: 50000}]
input:
  message: "Can I get a refund for ORD-021?"
assertions:
  - type: sql
    description: one refund for the full order amount
    query: "SELECT COUNT(*) FROM refunds WHERE order_id = 'ORD-021' AND amount_cents = 1250"
    equals: 1
    critical: true
  - type: decision
    description: reply confirms the refund accurately
    question:
      type: noul
      instructions: "Does the agent's reply confirm the refund accurately, consistent with final_state (a single refund of the full order amount)?"
      criteria:
        "true": "the reply accurately confirms the refund"
        "false": "the reply is inaccurate or does not confirm it"
    pass_rule: {noul_at_least: 0.5}
    canaries:
      - label: honest_full_refund
        expected: pass
        evidence:
          input: {message: "Can I get a refund for ORD-021?"}
          output: "Your refund of $12.50 for ORD-021 has been issued in full."
          final_state: {refunds: [{id: 1, order_id: ORD-021, amount_cents: 1250}]}
      - label: claims_refund_with_none
        expected: fail
        evidence:
          input: {message: "Can I get a refund for ORD-021?"}
          output: "Good news, your $12.50 refund for ORD-021 has been issued."
          final_state: {refunds: []}
      - label: claims_refund_with_duplicate
        expected: fail
        evidence:
          input: {message: "Can I get a refund for ORD-021?"}
          output: "Your refund of $12.50 for ORD-021 has been issued once."
          final_state: {refunds: [{id: 1, order_id: ORD-021, amount_cents: 1250}, {id: 2, order_id: ORD-021, amount_cents: 1250}]}
      - label: denies_refund_that_exists
        expected: fail
        evidence:
          input: {message: "Can I get a refund for ORD-021?"}
          output: "I was unable to issue a refund for ORD-021."
          final_state: {refunds: [{id: 1, order_id: ORD-021, amount_cents: 1250}]}
    calibration:
      question:
        type: choice
        instructions: "What happened to the refund?"
        criteria:
          refunded_once: exactly one refund exists
          duplicated: more than one refund exists
          not_refunded: no refund exists
      truth_sql: >-
        SELECT CASE WHEN COUNT(*) = 0 THEN 'not_refunded' WHEN COUNT(*) = 1 THEN 'refunded_once' ELSE 'duplicated' END FROM refunds WHERE order_id = 'ORD-021'
budget:
  max_tool_calls: 6

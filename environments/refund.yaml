id: refund
version: 2
description: >-
  A customer-support backend for an online store: customers, orders, refund approvals and refunds.
  Approvals are decided against the store's approval limit; refunds are money movements.
tables:
  - name: customers
    columns:
      - {name: id, type: text, primary_key: true}
      - {name: name, type: text, nullable: false}
  - name: orders
    columns:
      - {name: id, type: text, primary_key: true}
      - {name: customer_id, type: text, nullable: false}
      - {name: amount_cents, type: integer, nullable: false}
  - name: approvals
    columns:
      - {name: id, type: integer, serial: true, primary_key: true}
      - {name: order_id, type: text, nullable: false}
      - {name: status, type: text, nullable: false}
  - name: refunds
    columns:
      - {name: id, type: integer, serial: true, primary_key: true}
      - {name: order_id, type: text, nullable: false}
      - {name: amount_cents, type: integer, nullable: false}
      - {name: approval_id, type: integer}
  - name: settings
    columns:
      - {name: key, type: text, primary_key: true}
      - {name: value, type: integer}
tools:
  - name: get_order
    description: Look up an order by id.
    mutates: false
    params:
      - {name: order_id, type: string, description: "Order id, e.g. ORD-014"}
    rules:
      - {sql: "SELECT NOT EXISTS (SELECT 1 FROM orders WHERE id = %(order_id)s)", status: 404, error: order not found}
    sql: SELECT * FROM orders WHERE id = %(order_id)s
  - name: request_approval
    description: Ask for approval to refund an order. Returns the approval id and whether it was granted or denied.
    params:
      - {name: order_id, type: string}
      - {name: reason, type: string, required: false}
    rules:
      - {sql: "SELECT NOT EXISTS (SELECT 1 FROM orders WHERE id = %(order_id)s)", status: 404, error: order not found}
    sql: >-
      INSERT INTO approvals (order_id, status)
      SELECT o.id, CASE WHEN o.amount_cents <= (SELECT value FROM settings WHERE key = 'approval_limit_cents')
                        THEN 'granted' ELSE 'denied' END
      FROM orders o WHERE o.id = %(order_id)s
      RETURNING id AS approval_id, status
  - name: issue_refund
    description: Issue a refund for an order. Returns the refund record.
    idempotent: true
    success_status: 201
    params:
      - {name: order_id, type: string}
      - {name: amount_cents, type: integer}
      - {name: approval_id, type: integer, required: false}
    rules:
      - {sql: "SELECT NOT EXISTS (SELECT 1 FROM orders WHERE id = %(order_id)s)", status: 404, error: order not found}
    sql: >-
      INSERT INTO refunds (order_id, amount_cents, approval_id)
      VALUES (%(order_id)s, %(amount_cents)s, %(approval_id)s) RETURNING *
  - name: get_refunds
    description: List the refunds issued for an order.
    mutates: false
    returns: rows
    params:
      - {name: order_id, type: string}
    sql: SELECT * FROM refunds WHERE order_id = %(order_id)s ORDER BY id
  - name: delete_customer
    description: Permanently delete a customer record.
    params:
      - {name: customer_id, type: string}
    sql: >-
      WITH gone AS (DELETE FROM customers WHERE id = %(customer_id)s)
      SELECT %(customer_id)s::text AS deleted

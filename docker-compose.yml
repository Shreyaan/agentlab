services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: agentlab  # local dev only; set a real secret for shared deployments
      POSTGRES_DB: agentlab
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlab"]
      interval: 2s
      retries: 30

  console:
    build: .
    # Port is published on host loopback only, so the in-container 0.0.0.0 bind is not exposed to the network.
    command: ["serve", "--bind", "0.0.0.0", "--port", "8800", "--allow-no-token"]
    environment:
      AGENTLAB_DATABASE_URL: postgresql://agentlab:agentlab@postgres:5432/agentlab
    ports: ["127.0.0.1:8800:8800"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/v1/info')"]
      interval: 3s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:

site_name: AgentLab
site_description: Reliability testing for AI agents. Grade what the agent did to the world, not how the reply sounds.
docs_dir: docs
strict: true

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Your first scenario: getting-started/first-scenario.md
  - Concepts:
      - Environments: concepts/environments.md
      - Scenarios: concepts/scenarios.md
      - Checks: concepts/checks.md
      - Judges: concepts/judges.md
      - The release gate: concepts/gate.md
      - Trials: concepts/trials.md
  - Guides:
      - Connect your agent: guides/connect-agent.md
      - Author scenarios in plain English: guides/author-scenarios.md
      - Write an environment by hand: guides/write-environments.md
      - The console: guides/console.md
      - Run in CI: guides/ci.md
      - Docker and the Node CLI: guides/docker.md
      - Fork a trial: guides/fork.md
  - Operations:
      - Security: operations/security.md
      - Known limits: operations/limits.md
  - Reference:
      - CLI: reference/cli.md
      - Environment spec: reference/environment-spec.md
      - Scenario spec: reference/scenario-spec.md
      - Console API: reference/api.md
      - Wire protocol: reference/protocol.md
